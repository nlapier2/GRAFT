
# Dataset-centric GRAFT GNN config (per-dataset shards)
paths:
  index_parquet: artifacts_v2/cell_index.parquet
  scvi_model_dir: artifacts_v2/scvi_k562_controls/scvi_K562
  factor_U: artifacts_v2/learned_factor_encoders/factor_W_K562.npy

  # Per-dataset shards (repeat entries as needed)
  datasets:
    - id: K562_ReplogleWeissman
      z_parquet: artifacts_v2/z_by_dataset/K562_ReplogleWeissman.parquet
      h5ad: /data/K562_ReplogleWeissman.h5ad
      knn_parquet: artifacts_v2/knn_by_dataset/K562_ReplogleWeissman.knn.parquet
    - id: DixitRegev
      z_parquet: artifacts_v2/z_by_dataset/DixitRegev.parquet
      h5ad: /data/DixitRegev.h5ad

  # Train/val rows (subset of index_parquet)
  train_perturb: artifacts_v2/perturb_train.parquet
  val_perturb: artifacts_v2/perturb_val.parquet

model:
  n_programs: 256
  hidden: 256
  gnn_layers: 2
  use_factor_features: false
  transform_batch: null   # set to a reference batch ID if desired

training:
  mode: distribution      # "distribution" or "paired_controls"
  batch_size: 2048
  steps_per_epoch: 200
  max_epochs: 50
  lr: 1.0e-3
  dist_loss_weight: 1.0
  kd_consistency_weight: 0.5
  rex_weight: 0.1
  l1_direct_weight: 0.0
  interleave_global: false
  p_global: 0.2
  seed: 13
  forward_batch_size: 4096
