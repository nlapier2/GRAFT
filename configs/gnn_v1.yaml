seed: 13
batch_size: 1024
epochs: 10

paths:
  scvi_model_dir: artifacts_v2/scvi_k562_max200k_control_only/scvi_K562/
  scvi_input_h5ad: artifacts_v2/scvi_input_K562_max200k_controls.h5ad
  factor_U: artifacts_v2/learned_factor_encoders/factor_W_K562.npy
  index_parquet: artifacts_v2/cell_index.parquet
  gene_list: artifacts_v2/gene_list.tsv
  datasets_yaml: configs/datasets.yaml
  control_index_dir: artifacts_v2/knn_control_index/

data:
  n_genes: 6281
  L_ref: 1.0e4
  transform_batch: null
  gene_names: []

model:
  z_dim: 32
  propagator:
    hidden: 256
    layers: 2
    steps: 2
    dropout: 0.0
    use_env_film: true
    use_target_cond: true
    target_embed_dim: 32
  step0:
    hidden: 64
    init_eff: 0.9
    mode: down
  mediated:
    F: 273
    hidden: 256
    use_factor_feats: false
    a_dim: 0
    nonneg: true
    dropout: 0.0
  direct:
    hidden: 256
    dropout: 0.0

optim:
  name: adamw
  lr: 2.0e-4
  weight_decay: 1.0e-4

loss:
  distribution:
    type: swd     # swd | mmd | energy
    weight: 1.0
  rex:
    weight: 0.1
  irm:
    weight: 0.0
    use_target_only: true
  consistency:
    weight: 0.5
  direct:
    l1: 1.0e-4
    orth_to_U: 0.0
